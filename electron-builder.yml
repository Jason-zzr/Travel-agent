appId: com.travelharness.desktop
productName: Travel Harness
electronDist: node_modules/electron/dist
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/flyai-utility-process-launcher.cjs
  - '!node_modules/**/{test,tests,__tests__}/**'
asarUnpack:
  - resources/flyai-utility-process-launcher.cjs
  - node_modules/@fly-ai/flyai-cli/dist/flyai-bundle.cjs
extraResources:
  - from: resources/xhs-mcp/xiaohongshu-mcp-windows-amd64.exe
    to: xhs-mcp/xiaohongshu-mcp-windows-amd64.exe
  - from: resources/xhs-mcp/manifest.json
    to: xhs-mcp/manifest.json
  - from: resources/xhs-mcp/LICENSE.txt
    to: xhs-mcp/LICENSE.txt
win:
  executableName: travel-harness
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
