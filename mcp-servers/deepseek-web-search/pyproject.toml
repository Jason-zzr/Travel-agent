[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepseek-web-search-mcp"
version = "0.1.0"
description = "Read-only DeepSeek web search MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.12.4,<2",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
deepseek-web-search-mcp = "deepseek_web_search_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_web_search_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
